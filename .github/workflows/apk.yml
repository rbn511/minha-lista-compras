name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Extrair projeto
        run: unzip -q Minha-lista-projeto.zip
      - name: Compilar e testar
        run: gradle -p ListaCompras testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Minha-lista-APK
          path: ListaCompras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
